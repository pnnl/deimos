repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Run pyright from the active environment so it resolves installed dependencies
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
